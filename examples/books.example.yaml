# 书单的样子。agent 按 rules/editor/booklist.md 写，放在工作目录里。
# 每本书至少要有 title。file 不写时，prepare 会在 books/ 里按书名找同名的电子书。
# why_saved：这本书是从哪条笔记来的，选篇和写导语时会用到。

books:
  - title: 系统之美
    original_title: Thinking in Systems
    author: 德内拉·梅多斯
    translator: 邱昭良
    year: 2008
    file: books/系统之美.epub
    rights: licensed          # owned 自己的书 / licensed 书库取的 / public_domain 公版
    why_saved: 示例：收藏的一期播客里，嘉宾说做产品的人都该读它讲反馈回路的那一章。

  - title: 瓦尔登湖
    original_title: Walden
    author: 亨利·戴维·梭罗
    year: 1854
    rights: public_domain
    why_saved: 示例：一条讲「慢下来」的帖子里引了它的一段话。
